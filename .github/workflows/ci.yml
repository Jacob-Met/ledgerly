name: Verify Ledgerly
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  python-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q
  browser-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-demo/package-lock.json
      - run: npm ci
        working-directory: web-demo
      - run: npm audit --audit-level=moderate
        working-directory: web-demo
      - run: npm test
        working-directory: web-demo
      - run: npm run build
        working-directory: web-demo
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install browser receiver dependency
        run: python -m pip install --disable-pip-version-check -r tools/requirements-browser.txt
        working-directory: web-demo
      - name: Receive sandbox ledger CSV in installed Chrome
        working-directory: web-demo
        run: |
          chrome_bin="$(command -v google-chrome)"
          "$chrome_bin" --version
          python tools/check_ledger_export_browser.py dist "$RUNNER_TEMP/ledger-export-receiving" --chrome "$chrome_bin" --emit-bundle
      - name: Receive completed reviews in installed Chrome
        working-directory: web-demo
        env:
          LEDGERLY_HISTORY_EMIT_BUNDLE: '1'
        run: |
          chrome_bin="$(command -v google-chrome)"
          node tools/check_review_history_browser.mjs --source .. --dist dist --chrome "$chrome_bin" --output "$RUNNER_TEMP/completed-reviews-receiving"
