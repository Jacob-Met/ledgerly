name: Publish Ledgerly browser demo
on:
  push:
    branches: [main]
    paths: [ledgerly/**, fixtures/**, web-demo/**, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-demo/package-lock.json
      - run: npm ci
        working-directory: web-demo
      - run: npm run build
        working-directory: web-demo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web-demo/dist
      - id: deployment
        uses: actions/deploy-pages@v4